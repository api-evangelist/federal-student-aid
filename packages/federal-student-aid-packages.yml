description: >-
  Client library census for the surfaces on this record. The headline finding is an
  absence: neither Federal Student Aid nor the U.S. Department of Education publishes
  a first-party SDK for any of its APIs on any package registry. Everything below is
  third-party and unofficial, and every one of them is either stale or a single-author
  side project. No SDKs pointer is wired into apis.yml, because doing so would credit
  the provider with client tooling it did not ship.
