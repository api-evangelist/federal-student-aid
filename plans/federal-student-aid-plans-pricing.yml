description: >-
  Plans and pricing for the College Scorecard API, the one publicly callable
  surface on this Federal Student Aid record. Replaces the 2026-05-04 scaffold,
  which invented a "Free" tier with a 1,000-requests-per-month quota that the
  Department has never published. There are no plans: the API is a free U.S.
  government data service with a single self-service key and no billing
  relationship of any kind.
plan_count: 0
