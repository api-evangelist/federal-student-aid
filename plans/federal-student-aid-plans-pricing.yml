pricing_model: free-government-service
currency: USD
commercial: false
findings:
  - >-
    No pricing page exists and none is expected — the College Scorecard API is
    published under the Foundations for Evidence-Based Policymaking Act open-data
    obligations, not as a commercial product.
  - >-
    Access control is a free API key issued automatically by api.data.gov
    (https://api.data.gov/signup/, HTTP 200 on 2026-09-09). There is no paid tier,
    no overage, no enterprise contract and no "contact us" sales gate.
  - >-
    The only lever above the default allowance is a courtesy rate-limit increase by
    email to scorecarddata@rti.org. It is a support request, not a plan.
  - >-
    Federal Student Aid's own partner systems (FSA Partner Connect, SAIG, COD,
    NSLDS) are not priced either; access is granted by program enrollment to
    schools, servicers and vendors rather than purchased.
quota_reference: rate-limits/federal-student-aid-rate-limits.yml
