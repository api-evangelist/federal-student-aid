false_positive_note: StudentAid.gov answers HTTP 200 with its Angular shell for every /.well-known/* path
  it does not 404. The shell is the same 10,905-byte body returned for a deliberately bogus URL, so those
  200s are catch-all responses, not served documents. www.ed.gov returns 403 to an automated client on
  /.well-known/security.txt, which is an edge policy rather than evidence either way; the Department does
  publish a vulnerability disclosure policy as an HTML page instead (see security/federal-student-aid-vulnerability-disclosure.yml).
