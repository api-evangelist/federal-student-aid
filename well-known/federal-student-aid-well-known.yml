  platform and its www alias, the api.data.gov gateway that serves the College Scorecard API, the College
  Scorecard docs host, the FSA Partner Connect host, and the parent department at www.ed.gov. Nine named
  paths were probed on each of six hosts, 54 probes in total. Nothing was found: no security.txt, no api-catalog,
  no OAuth or OpenID metadata, no agent card. This file records a measured absence, and no WellKnown or
  SecurityTxt pointer is wired into apis.yml as a result.'
